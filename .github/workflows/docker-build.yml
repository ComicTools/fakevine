name: Build and Publish Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [prod, dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        run: |
          VARIANT_SUFFIX=""
          if [ "${{ matrix.variant }}" = "dev" ]; then
            VARIANT_SUFFIX="-dev"
          fi

          IMAGE_NAME=${GITHUB_REPOSITORY,,}

          TAGS=""
          DOCKERFILE="Dockerfile"

          if [ "${{ matrix.variant }}" = "dev" ]; then
            DOCKERFILE="Dockerfile.dev"
          fi

          # If this is a release (tag push)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="${{ env.REGISTRY }}/${IMAGE_NAME}:latest${VARIANT_SUFFIX}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${IMAGE_NAME}:v${VERSION}${VARIANT_SUFFIX}"
          # If this is a commit to master
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="${{ env.REGISTRY }}/${IMAGE_NAME}:nightly${VARIANT_SUFFIX}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: steps.meta.outputs.tags != ''
        with:
          context: .
          file: ./${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f # v1.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-untagged: 5